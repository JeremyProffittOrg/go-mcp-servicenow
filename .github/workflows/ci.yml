name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner preference
        required: true
        default: auto
        type: choice
        options:
          - auto
          - home
          - github-hosted

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      selected: ${{ steps.pick.outputs.selected }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_QUERY_TOKEN }}
          RUNNER_INPUT: ${{ inputs.runner }}
        shell: bash
        run: |
          set -euo pipefail

          github='["ubuntu-latest"]'
          home='["self-hosted","Linux","X64","home","tiny310"]'

          if [[ "$RUNNER_INPUT" == "github-hosted" ]]; then
            echo "runs_on=$github" >> "$GITHUB_OUTPUT"
            echo "selected=github-hosted-requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runners="$(gh api "orgs/JeremyProffittOrg/actions/runners?per_page=100")"
          available="$(
            jq -r '
              .runners[]
              | select(.name == "tiny310")
              | select(.status == "online")
              | select(.busy == false)
              | [.labels[].name] as $labels
              | select(["self-hosted","Linux","X64","home","tiny310"] - $labels | length == 0)
              | .name
            ' <<< "$runners" | head -n 1
          )"

          if [[ "$RUNNER_INPUT" == "home" && -z "$available" ]]; then
            echo "tiny310 was requested but is not online and idle" >&2
            exit 1
          fi

          if [[ -n "$available" ]]; then
            echo "runs_on=$home" >> "$GITHUB_OUTPUT"
            echo "selected=home-auto" >> "$GITHUB_OUTPUT"
          else
            echo "runs_on=$github" >> "$GITHUB_OUTPUT"
            echo "selected=github-hosted-fallback" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Show runner
        shell: bash
        run: |
          echo "Selected: ${{ needs.route.outputs.selected }}"
          echo "Runner: $RUNNER_NAME"
          hostname

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

  test:
    name: Test
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Show runner
        shell: bash
        run: |
          echo "Selected: ${{ needs.route.outputs.selected }}"
          echo "Runner: $RUNNER_NAME"
          hostname

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Show runner
        shell: bash
        run: |
          echo "Selected: ${{ needs.route.outputs.selected }}"
          echo "Runner: $RUNNER_NAME"
          hostname

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  docker:
    name: Docker Build
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Show runner
        shell: bash
        run: |
          echo "Selected: ${{ needs.route.outputs.selected }}"
          echo "Runner: $RUNNER_NAME"
          hostname

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: go-mcp-servicenow:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
